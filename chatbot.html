<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Coach AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, rgba(168, 232, 211, 0.15), rgba(168, 216, 232, 0.1));
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(110, 199, 165, 0.12);
        }

        .chat-header {
            background: linear-gradient(135deg, #6ec7a5, #a8e6d3);
            color: white;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 4px 12px rgba(110, 199, 165, 0.2);
        }

        .chat-header i {
            font-size: 1.5rem;
        }

        .chat-header h2 {
            font-size: 1.3rem;
            flex: 1;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: rgba(110, 199, 165, 0.1);
            border: 1px solid rgba(110, 199, 165, 0.2);
            color: #2c3e50;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #6ec7a5, #a8e6d3);
            color: white;
        }

        .typing-indicator {
            display: flex;
            gap: 0.4rem;
            padding: 0.75rem 1rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6ec7a5;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.4;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .chat-input-area {
            padding: 1.5rem;
            background: rgba(110, 199, 165, 0.05);
            border-top: 1px solid rgba(110, 199, 165, 0.1);
            display: flex;
            gap: 1rem;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 1rem;
            border: 1px solid rgba(110, 199, 165, 0.2);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            max-height: 100px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #6ec7a5;
            box-shadow: 0 0 0 3px rgba(110, 199, 165, 0.1);
        }

        .chat-send-btn {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #6ec7a5, #a8e6d3);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(110, 199, 165, 0.2);
        }

        .chat-send-btn:active {
            transform: translateY(0);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 3rem;
            color: #6ec7a5;
            margin-bottom: 1rem;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .suggested-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
            padding: 0 1.5rem;
        }

        .suggested-btn {
            padding: 0.5rem 1rem;
            background: rgba(110, 199, 165, 0.1);
            color: #6ec7a5;
            border: 1px solid rgba(110, 199, 165, 0.2);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .suggested-btn:hover {
            background: rgba(110, 199, 165, 0.2);
            border-color: #6ec7a5;
        }

        @media (max-width: 768px) {
            .message-content {
                max-width: 90%;
            }

            .chat-input-area {
                padding: 1rem;
            }

            .chat-header {
                padding: 1rem;
            }

            .chat-messages {
                padding: 1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(110, 199, 165, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(110, 199, 165, 0.5);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <i class="fas fa-robot"></i>
            <h2>WellnessFlow Health Coach</h2>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
                <i class="fas fa-comments"></i>
                <p>Start a conversation with your health coach!</p>
                <div class="suggested-prompts" id="suggestedPrompts">
                    <button class="suggested-btn" onclick="sendMessage('Tell me about healthy eating habits')">
                        <i class="fas fa-apple-alt"></i> Healthy Diet
                    </button>
                    <button class="suggested-btn" onclick="sendMessage('How can I reduce stress?')">
                        <i class="fas fa-spa"></i> Stress Management
                    </button>
                    <button class="suggested-btn" onclick="sendMessage('What exercises should I do?')">
                        <i class="fas fa-running"></i> Fitness Tips
                    </button>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="Ask your health coach anything..."
                    rows="1"
                ></textarea>
            </div>
            <button class="chat-send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
                <span>Send</span>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const suggestedPrompts = document.getElementById('suggestedPrompts');
        let isFirstMessage = true;

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Send message on Enter (but allow shift+Enter for new line)
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage(suggestedText = null) {
            const message = suggestedText || chatInput.value.trim();
            if (!message) return;

            // Remove empty state on first message
            if (isFirstMessage) {
                chatMessages.innerHTML = '';
                isFirstMessage = false;
            }

            // Add user message
            addMessage(message, 'user');
            chatInput.value = '';
            chatInput.style.height = 'auto';

            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        assessment: getAssessmentData()
                    })
                });

                const data = await response.json();
                removeTypingIndicator();

                if (data.success) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'bot');
                }

                // Auto-scroll to bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator();
                addMessage('Unable to connect to the health coach. Please try again.', 'bot');
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);
        }

        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';
            
            const typingContent = document.createElement('div');
            typingContent.className = 'typing-indicator';
            typingContent.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            messageDiv.appendChild(typingContent);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function getAssessmentData() {
            try {
                const assessment = localStorage.getItem('assessment');
                return assessment ? JSON.parse(assessment) : null;
            } catch {
                return null;
            }
        }

        // Initial greeting
        window.addEventListener('load', function() {
            setTimeout(() => {
                addMessage(
                    "👋 Hi there! I'm your WellnessFlow Health Coach. I'm here to help you with personalized health guidance based on your assessment. What would you like to know?", 
                    'bot'
                );
            }, 500);
        });
    </script>
</body>
</html>
